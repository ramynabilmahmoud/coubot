name: Flutter CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env is listed as an asset but is not committed
      - name: Create empty .env
        run: touch .env

      - run: flutter pub get
      - run: flutter test
