
  name: coubot
  description: "A new Flutter project."
  publish_to: 'none'
  version: 0.1.0

  environment:
    sdk: ^3.9.2

  dependencies:
    app_links: ^6.4.1
    auto_route: ^9.2.2
    cached_network_image: ^3.4.1
    crypto: ^3.0.7
    dartz: ^0.10.1
    dio: ^5.9.0
    equatable: ^2.0.7
    flutter:
      sdk: flutter
    flutter_bloc: ^9.1.1
    flutter_dotenv: ^6.0.0
    flutter_localizations:
      sdk: flutter
    flutter_local_notifications: ^18.0.1
    flutter_svg: ^2.2.3
    get_it: ^9.2.0
    google_fonts: ^6.3.3
    hive: ^2.2.3
    hive_flutter: ^1.1.0
    image_picker: ^1.1.2
    injectable: ^2.7.0
    intl: ^0.20.2
    lottie: ^3.3.2
    pinput: ^6.0.1
    supabase_flutter: ^2.10.3
    upgrader: ^12.3.0
    shared_preferences: ^2.5.0
    http: ^1.2.1

  dev_dependencies:
    auto_route_generator: ^9.0.0
    hive_generator: ^2.0.1
    injectable_generator: ^2.6.1
    build_runner: ^2.4.11
    flutter_lints: ^5.0.0
    intl_utils: ^2.8.7
    flutter_test:
      sdk: flutter


  flutter:
    uses-material-design: true

    assets:
      - assets/gen/images/
      - assets/gen/SVGs/
      - .env

    fonts:
        - family: MadeEvolveSans
          fonts:
              - asset: assets/gen/fonts/MadeEvolveSans-Regular.otf
              - asset: assets/gen/fonts/MadeEvolveSans-Bold.otf
                weight: 700

        - family: MadeEvolveSansEvo
          fonts:
              - asset: assets/gen/fonts/MadeEvolveSansEvo-Regular.otf

        - family: LeagueSpartan
          fonts:
              - asset: assets/gen/fonts/LeagueSpartan-Light.ttf
                weight: 300
              - asset: assets/gen/fonts/LeagueSpartan-Regular.ttf
                weight: 400
              - asset: assets/gen/fonts/LeagueSpartan-Bold.ttf
                weight: 700

  flutter_intl:
    enabled: true

  flutter_assets:
    assets_path: assets/gen/
    output_path: lib/core/utils/
    filename: assets.dart
    field_prefix: null